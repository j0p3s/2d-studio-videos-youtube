plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.j0p3s.studio'
    compileSdk 35
    defaultConfig { applicationId 'com.j0p3s.studio'; minSdk 35; targetSdk 35; versionCode 2; versionName '0.2.0'; testInstrumentationRunner 'com.j0p3s.studio.DeviceChecks'; ndk { abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
chaquopy {
    defaultConfig {
        version = '3.12'
        pip { install 'edge-tts==7.3.1'; install 'aiohttp==3.10.10' }
    }
}
dependencies { implementation 'androidx.core:core:1.15.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
