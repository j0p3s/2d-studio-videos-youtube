name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['Adnroid-App/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['Adnroid-App/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug lintDebug
        working-directory: Adnroid-App
      - uses: actions/upload-artifact@v4
        with:
          name: StudioAndroid-debug
          path: Adnroid-App/app/build/outputs/apk/debug/app-debug.apk
